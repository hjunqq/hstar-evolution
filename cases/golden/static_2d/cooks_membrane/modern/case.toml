# Cook's membrane under self-weight. See docs/m5/authoring-contract.md.
version = 1

[case]
name        = "cooks_membrane"
units       = "SI"
description = "Cook's membrane, 16x16 Q4 plane strain, gravity only"

[mesh]
file      = "1"
format    = "hstar-legacy-cor-ele"
dimension = 2

[[elset]]
name       = "body"
element_count = 256   # elements are taken from 1.ele in file order, legacy's own rule

[[nset]]
name  = "clamped_edge"
nodes = [1, 18, 35, 52, 69, 86, 103, 120, 137, 154, 171, 188, 205, 222, 239, 256, 273]

[[material]]
name    = "concrete"
model   = "elastic_isotropic"
density = 2400.0
E       = 2.5e10
nu      = 0.2
thermal_expansion = 1.0e-5   # 1/K, from the deck

[[section]]
name        = "membrane"
elset       = "body"
element     = "Q4"
formulation = "plane_strain"
material    = "concrete"

[[amplitude]]
name   = "constant"
type   = "linear"
points = [[0.0, 1.0], [1.0, 1.0]]

[[step]]
name      = "self_weight"
procedure = "static"
load_mode = "load"
reset_state   = false   # legacy uinitial = 0: the step does not zero the result buffers
active_elsets = ["body"]   # every group is in the model from the start

[step.controls]
increments      = 1
substeps        = 1     # one load step
time_increment  = 1.0   # the curve abscissa this step advances
max_iterations  = 5
tolerance_force = 1.0e-5
tolerance_dof   = 1.0e-5
# WHEN the tangent is rebuilt (legacy type_nl). Written out rather than defaulted:
# on a linear-elastic run the choice cannot change the answer, on a non-linear one it can,
# and a default whose innocence depends on the material is not a default.
stiffness_update = "first_iteration"

[[step.boundary]]
nset  = "clamped_edge"
dof   = [1, 2]
value = 0.0


[[step.load]]
type      = "gravity"
magnitude = 9.81
direction = [0.0, -1.0]
amplitude = "constant"
apply_to  = "all"   # every element group is on this gravity history

[solver]
linear = "profile"

[output]
format = "gid"
field  = ["u", "s"]
# Reported nodal stresses are the direct average of the elements meeting at the node
# (legacy average_appear=2). This changes the numbers that are reported, so it is written out.
stress_averaging = "direct"
