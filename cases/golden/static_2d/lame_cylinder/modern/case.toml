# Cook's membrane under self-weight. See docs/m5/authoring-contract.md.
version = 1

[case]
name        = "lame_cylinder"
units       = "SI"
description = "Quarter Lame cylinder, 8x8 Q4 plane strain, gravity only (regression case; no internal pressure, so the Lame solution does not apply)"

[mesh]
file      = "1"
format    = "hstar-legacy-cor-ele"
dimension = 2

[[elset]]
name       = "body"
mesh_group = 1

# Quarter symmetry: the y=0 edge slides in x (uy = 0), the x=0 edge slides in y (ux = 0).
[[nset]]
name  = "sym_y0"
nodes = [1, 2, 3, 4, 5, 6, 7, 8, 9]

[[nset]]
name  = "sym_x0"
nodes = [73, 74, 75, 76, 77, 78, 79, 80, 81]

[[material]]
name    = "concrete"
model   = "elastic_isotropic"
density = 2400.0
E       = 2.5e10
nu      = 0.2

[[section]]
name        = "ring"
elset       = "body"
element     = "Q4"
formulation = "plane_strain"
material    = "concrete"

[[amplitude]]
name   = "constant"
type   = "linear"
points = [[0.0, 1.0], [1.0, 1.0]]

[[step]]
name      = "self_weight"
procedure = "static"

[step.controls]
increments      = 1
max_iterations  = 5
tolerance_force = 1.0e-5
tolerance_dof   = 1.0e-5

[[step.boundary]]
nset  = "sym_y0"
dof   = [2]
value = 0.0

[[step.boundary]]
nset  = "sym_x0"
dof   = [1]
value = 0.0

[step.load.gravity]
magnitude = 9.81
direction = [0.0, -1.0]
amplitude = "constant"

[solver]
linear = "profile"

[output]
format = "gid"
field  = ["u", "s"]
