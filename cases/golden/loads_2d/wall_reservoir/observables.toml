# 观察量登记。在任何结果数值被查看之前登记的是**结构**——块名、分量名、节点数——
# 不是数值。分量名取自 1.flavia.res 的块头，节点/单元数取自 1.glb 的 NPOIN/NELEM。
version = 1
case_id = "loads_2d.wall_reservoir"
units = "SI"

[source]
file = "1.flavia.res"
format = "gid-flavia-ascii"
header_layout = "name, type(1=vector,3=matrix), step, ncomp, location, has_component_names; data rows: node_id + ncomp values (E format, 8 significant digits)"
expected_node_count = 46
expected_element_count = 32
note = "两个分析步各写一次 DISPLACEMENT 与 STRESS，共 4 块。步号本身是观察量的一部分：只有一步的输出无法与这份参考比较"

[[observable]]
id = "displacement"
kind = "nodal_vector"
components = ["ux", "uy"]
unit = "m"
required = true

[[observable]]
id = "stress"
kind = "nodal_tensor"
components = ["SIGXX", "SIGYY", "SIGXY", "SIGZZ"]
unit = "Pa"
required = true
