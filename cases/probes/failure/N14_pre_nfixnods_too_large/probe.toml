schema = 1
id = "N14_pre_nfixnods_too_large"
base_case = "static_2d.cooks_membrane"
description = "1.pre line 3 field 2 (nfixnods of set 1) 17 -> 300 with npoin=289: nfixnods sizes list_fix/val_fix and bounds the node loop, so set_header reports RANGE immediately (allowed=1..npoin) before allocate/read of the 17-entry node line (which would otherwise EOF)."

[[derive]]
op = "set_field"
file = "1.pre"
line = 3
field = 2
value = "300"

[expect]
status = "INPUT_ERROR"
exit_code = 2
code = "RANGE"
stage = "startup"
file_suffix = ".pre"
reader = "PRE.prescrib_set.set_header"
field = "nfixnods"
index = 1
value = "300"
no_core = true
max_wall_seconds = 10
