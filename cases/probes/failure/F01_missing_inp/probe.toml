schema = 1
id = "F01_missing_inp"
base_case = "static_2d.cooks_membrane"
description = "Delete inp from the deck: the checked open (status='old') must report FILE_MISSING at startup, before any read of that unit."

[[derive]]
op = "delete_file"
file = "inp"

[expect]
status = "INPUT_ERROR"
exit_code = 2
code = "FILE_MISSING"
stage = "startup"
file_suffix = "inp"
no_core = true
max_wall_seconds = 10
