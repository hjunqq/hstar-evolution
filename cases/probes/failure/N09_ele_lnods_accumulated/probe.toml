schema = 1
id = "N09_ele_lnods_accumulated"
base_case = "static_2d.cooks_membrane"
description = "1.ele three bad nodes: line 1 field 2 1 -> 0 (zero), line 3 field 3 4 -> 290 (npoin+1), line 5 field 4 23 -> -1 (negative). read_element must keep looping (invalid elements skipped, no coord access) and accumulate one REF per bad record, flushing at end of file: three records with indices 1,3,5 in order; first record value=0."

[[derive]]
op = "set_field"
file = "1.ele"
line = 1
field = 2
value = "0"
[[derive]]
op = "set_field"
file = "1.ele"
line = 3
field = 3
value = "290"
[[derive]]
op = "set_field"
file = "1.ele"
line = 5
field = 4
value = "-1"

[expect]
status = "INPUT_ERROR"
exit_code = 2
code = "REF"
stage = "startup"
file_suffix = ".ele"
reader = "ELE.read_element.element_connectivity"
field = "lnods"
index = 1
value = "0"
diag_count = 3
indices = [1, 3, 5]
no_core = true
max_wall_seconds = 10
