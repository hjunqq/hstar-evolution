schema = 1
id = "N13_pre_itcurve_out_of_range"
base_case = "static_2d.cooks_membrane"
description = "1.pre line 3 field 3 (itcurve of prescribed set 1) 0 -> 5 with ntcurve=1 in 1.loa: itcurve references tcurves(1:ntcurve), so set_header raises REF immediately (set-header guards do not accumulate); record index is ifixset=1."

[[derive]]
op = "set_field"
file = "1.pre"
line = 3
field = 3
value = "5"

[expect]
status = "INPUT_ERROR"
exit_code = 2
code = "REF"
stage = "startup"
file_suffix = ".pre"
reader = "PRE.prescrib_set.set_header"
field = "itcurve"
index = 1
value = "5"
no_core = true
max_wall_seconds = 10
