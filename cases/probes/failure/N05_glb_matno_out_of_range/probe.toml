schema = 1
id = "N05_glb_matno_out_of_range"
base_case = "static_2d.cooks_membrane"
description = "1.glb line 59 (group 1 header) field 10 (matno) 1 -> 7 with nmats=1: matno references the material table, so the group_header guard reports REF (allowed=1..nmats); igroup=1 is the record index."

[[derive]]
op = "set_field"
file = "1.glb"
line = 59
field = 10
value = "7"

[expect]
status = "INPUT_ERROR"
exit_code = 2
code = "REF"
stage = "startup"
file_suffix = ".glb"
reader = "GLB.global_data.group_header"
field = "matno"
index = 1
value = "7"
no_core = true
max_wall_seconds = 10
