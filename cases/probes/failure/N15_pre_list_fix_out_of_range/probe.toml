schema = 1
id = "N15_pre_list_fix_out_of_range"
base_case = "static_2d.cooks_membrane"
description = "1.pre line 4 field 1 (first node of set 1) 1 -> 290 with npoin=289: set_nodes raises REF for list_fix (allowed=1..npoin), accumulated and flushed at end of .pre; index is ifixset=1."

[[derive]]
op = "set_field"
file = "1.pre"
line = 4
field = 1
value = "290"

[expect]
status = "INPUT_ERROR"
exit_code = 2
code = "REF"
stage = "startup"
file_suffix = ".pre"
reader = "PRE.prescrib_set.set_nodes"
field = "list_fix"
index = 1
value = "290"
no_core = true
max_wall_seconds = 10
