schema = 1
id = "S03_BC_cooks"
base_case = "static_2d.cooks_membrane"
description = "1.pre line 5 field 1 (prescribed values of set 1) 17*0. -> 1.0e-3,16*0., i.e. the first constrained DOF of set 1 moves from 0 to 1.0e-3 m. The state comparator must report exactly one primary MISMATCH on steps0.boundary.value at model_ready, on the record of set 1 / node 1, with 1 of the 34 boundary values changed. runtime.dof.fixed and runtime.dof.fixed_at_increment must NOT appear: modf_var_prescribed runs at Fem.f90:3667, after the model_ready anchor, so the constraint is still only visible on the prescribed values (R24). This probe encodes R24 as a test."

[[derive]]
op = "set_field"
file = "1.pre"
line = 5
field = 1
value = "1.0e-3,16*0."
original_token = "17*0."

