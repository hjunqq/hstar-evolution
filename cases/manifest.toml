# load itself: 126 nodes, 100 elements, one group, one elastic material, one block, Q4 /
# PROFILE / LOAD / type_nl 5 -- every one of which the whitelist already admits. A simply
# supported 1.0 x 0.25 m plate, held at both bottom corners, with -10 kN at the centre of
# the top edge. Its body force is ZERO (gravy = 0, factg = (0,0)), which makes it the one
# golden case whose displacement field is decided entirely by the new capability: lose the
# point load and the answer is not wrong, it is identically zero.


