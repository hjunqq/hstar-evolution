# This deck could not be frozen before 2026-09-17: it SIGSEGV'd, on the pristine legacy
# snapshot as well as here. The cause was legacy's own -- Stiff.f90 read an uninitialised
# kind_wt and dereferenced an unallocated isatu on every visit after the first. That one-line
# repair is a PRE-MIGRATION DEFECT FIX, recorded in docs/m8/sigsegv-investigation.md and
# docs/m8/pre-migration-defects.md; it is NOT part of the DUNCANCHANG modernisation.
#
# Capability delta against plasticity.mini_mc, measured file by file rather than assumed:
#   .mat  DUNCANCHANG + the EB sub-record          <- the new capability
#   .man  nstep 1 -> 10, miter 10 -> 20            <- already in [step.controls]
#   .glb  type_nl 4 -> 5 (stiffness_update)        <- already admitted by the whitelist
#         res_s 0 -> 1                             <- binary 1.res only, not an observable
#         nmats/ngroup 2 -> 1, one Q4 group
# Everything else (.pre .opr .tem .ftr .ifs .nrt .aqu) is byte-identical to mini_mc, and the
# .loa differs only in the group count. The mesh is mini_mc's: 30 nodes, 20 Q4 elements.
