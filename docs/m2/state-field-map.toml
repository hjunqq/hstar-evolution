# HSTAR Evolution — M2-01 checkpoint × state field map (authoritative, hand-maintained)
# Generated 2026-09-07 from .ccg/tasks/m2-01-state-field-map/analysis-legacy.md §1-§4 against legacy/yl (static_2d path);
# edit by hand afterwards.
# Validate with: python3 tools/yl_state_map.py check
# ID rule: object path `<top>[<step>].<attribute chain>`, regex ^[a-z][a-z0-9]*(\.[A-Za-z0-9_]+)+$ (steps[0] is written `steps0`);
#          RuntimeState ids start with `runtime.`, derived counts/maps with `derived.`, non-migrated switches with `control.` / `output.`.
# legacy_symbol rule: <module>.<variable>[%component...] as declared in legacy/yl (module global_var / materials / prescribed /
#          applied_load / temperature / solver / meshfine); `element%...` components are declared in module elements (Elements.f90).
# source rule: exact reader ids from docs/m1/reader-inventory.toml, or exactly one
#          `derived:<count|index_map|renumber|legacy_default|dof_expand|geometry>`. The derive-rule kinds, which say what the
#          build stage must DO to produce the value (the closed set is enforced by tools/yl_state_map.py, DERIVED_RULES):
#            count          -- the cardinality of a contract collection (npoin = count(mesh.nodes)).
#            index_map      -- a lookup from a contract name or id to the legacy positional index it occupies.
#            renumber       -- a new dense numbering assigned by walking the legacy order (totveq/iseq).
#            legacy_default -- a constant LOOKED UP, not computed: a value the legacy path fixes for this profile and the
#                              ADR-0003 contract does not author (a PROFILE control int, an unused switch, a zeroed buffer).
#            dof_expand     -- a per-node or per-element quantity expanded over the dofs of the formulation.
#            geometry       -- COMPUTED from the mesh geometry and the formulation's quadrature rule, not looked up: the
#                              build stage must evaluate shape functions / the Jacobian at the Gauss points to obtain it.
# checkpoint.site / anchor: the statement BEFORE which the snapshot is taken; anchor = yl_io_inventory.anchor_hash(full_statement(site)).
# Same legacy symbol at two checkpoints is two rows (e.g. tcurves%dfact, fixed).
# owner rule: one owner path per row. `derived` and `not_migrated` are buckets and repeat; every other owner is a real object
#          path and (owner, checkpoint) must be UNIQUE (checked). Two rows may share an owner path only across checkpoints,
#          which is the "same symbol at two checkpoints" case above (runtime.dof.fixed / fixed_at_increment).
# legacy_only rule: optional boolean, default false, allowed only on `ProblemState.*` rows. true marks a field that exists ONLY
#          so the bridge can rebuild a legacy record: it has NO counterpart in the ADR-0003 authoring contract, yet the bridge
#          must still produce a value to write the .glb / .pre / .loa / .man / .sol record. Two evidence classes, both readable
#          from the row itself:
#            A positional slot -- one slot of a fixed-width legacy record whose modern counterpart is a named object or list, so
#              the slot position carries the meaning. The 20 GiD write flags (one .glb record of 20 ints), the four PROFILE
#              control ints, and the classification/switch chars of the .glb group header and the MAT elastic_isotropic record.
#              The note of such a row records a guard with a value that is constant on this path, or no consumer at all.
#            B legacy handle -- an internal legacy index, array position, or in-place-overwritten duplicate that the contract
#              addresses by name instead: materials[].id (the props(:) index), sections[].element_kind (the elkn table index),
#              sections[].material_header (the .glb header value overwritten at Fem.f90:1717), and the per-element
#              denormalisations mesh.elements[].kind / .material, which restate what the element's section already says.
#          legacy_only is NOT "unused on static_2d": materials[].thermal_expansion is a physical property with a contract
#          counterpart that this path happens not to consume, so it is false. It is also NOT set on `derived`, `RuntimeState.*`
#          or `not_migrated` rows -- their owner already says they are outside the authoring contract (checked).
#          Current set: 47 of the 98 ProblemState rows. M5 may retire exactly these instead of promoting Fortran slots into v1.

version = 1
path = "static_2d: 2D Q4 plane-strain linear-elastic, PROFILE, gravity, single increment"
cases = ["static_2d.cooks_membrane", "static_2d.lame_cylinder"]
reader_inventory = "docs/m1/reader-inventory.toml"
float_format = "hex"

# WARNING: these descriptions are NOT free prose. tools/yl_state.py (MapIndex, ~line 165) derives the set of
# ragged shape symbols by searching each description for the word "ragged", and that set changes how a field is
# normalised. Dropping or rewording that word therefore alters the normalized snapshot and breaks the frozen
# baselines in cases/golden/*/reference/state (M2-03). A ragged symbol's description MUST contain "ragged".
# Snapshot-affecting keys overall: dtype, index_by, shape, the exported field set, and these descriptions.
# Annotation-only keys, free to correct: owner, note, legacy_only.
[shape_symbols]
ndimn = "mesh.dimension (2 on both cases)"
npoin = "count(mesh.nodes)"
nelem = "count(mesh.elements)"
nnode = "nodes per element from sections[].element_kind (4 for Q4)"
ngroup = "count(sections) = count(mesh.elsets)"
nelgroup = "count(mesh.elsets[].elements) per group = group(ig)%nelgroup (ragged; 256 on both cases with ngroup=1)"
nmats = "count(materials)"
nrfields = "count(sections[].formulation.fields) per group (1 on both cases)"
nfdof = "count(sections[].formulation.dofs) per field (2 on both cases)"
mdofn = "sum over distinct global dofs of sections[].formulation.dofs (2 on both cases)"
cdofn = "count(lmdofn /= 0) after Global.f90:1119-1125 (= mdofn on both cases)"
ntotv = "count of numbered (dof,node) pairs = max(nodfn) (Global.f90:2147-2156)"
neq = "count(totveq /= 0) after totv_to_eq (Solver.f90:9027)"
nevab = "nfdof * nnode (8 for Q4 with 2 dofs)"
ngaus = "Gauss points per element from elkn(index)%ggaus(order_int)%ngaus (4 for Q4)"
ntcurve = "count(amplitudes)"
ntime = "count(amplitudes[].points) per curve (ragged)"
nfixsets = "count(steps[0].boundary)"
ndofix = "count of prescrib records = sum over sets of listed nodes with nodfn /= 0 (Prescrib.f90:257)"
nblks = "count(steps) (1 on both cases)"
nblks1 = "nblks+1: block columns 0..nblks of appear_process (Global.f90:964); column 0 = initial state, zeroed at :968"
np_unode = "per group: count of nodes attached to elements of that group (Global.f90:1383-1392, allocate at :1392); ragged over groups"
ngaus_mass = "Gauss points of the second integration rule elkn(index)%ggaus(2)%ngaus (16 for Q4, Elements.f90:383); never consumed on static_2d (q4 order_intrules=(/1,1/), :377)"
Stiff_length = "iseq(neq) after PROFILE SET (Solver.f90:7229) = size(global_stiff1)"

[[checkpoint]]
id = "model_ready"
order = 1
covered = true
site = "Fem.f90:1909"
anchor = "4f74a710eb3a"
anchor_stmt = "operation='SET'"
after = ["Fem.f90:1899", "Fem.f90:1903", "Fem.f90:1904"]
first_consumer = "SOLVE"
snapshot_files = ["control.json", "mesh.sha256", "dof.sha256", "groups.json", "materials.json", "constraints.sha256", "loads.sha256", "steps.json", "numerics.json"]
note = "Inside block loop 1 of process_analysis, after the last executed reader (TEM.boundt.pipe_count via `call boundt` at :1899) and the cursor bookkeeping at :1903-1904, before `operation='SET'; call solve` (:1908-1909). PROFILE SET (Solver.f90:6820-7248) is the first consumer: it reads .sol and builds totveq/neq/iseq from iffix, trans%nintf, nodfn, appear, group%list and element%ldofs. Requirements wording 'before the first global_stif_profile/stiff_u' is not taken literally (first stiff_u is :3733, after the .man readers); the consistent reading is 'before the solver structure is built'. Valid only under the guard set restart=0, nblks=1, type_problem='Q', type_solver='PROFILE', relis=0, block_stab=0, ADINA=0, ngaps=nrcsteel=0. .pre/.loa/.tem are tagged phase=startup in M1 but execute inside block 1 (:1873-1899); for nblks>1 they are per block and this anchor moves with iblks."

[[checkpoint]]
id = "phase_ready(1)"
order = 2
covered = true
site = "Fem.f90:3603"
anchor = "d61e64d3a931"
anchor_stmt = "if(ngaps/=0.or.nrcsteel/=0)allocate(tofor0(ntotv))"
after = ["Fem.f90:3594", "Fem.f90:3597"]
first_consumer = "STATIC_U"
snapshot_files = ["steps.json", "numerics.json"]
note = "Inside STATIC_U after the .man title + nincs records (:3592-3594) and diag_flush_stage (:3597). The first consumer of nincs is STATIC_U's own increment loop `do iincs=lincs+1,nincs` (:3622); :3601 (ngaps=nrcsteel=0) and :3603-3617 (lincs=0) are dead on this path. Holds the ProblemState.solver.profile fields read by PROFILE SET (solver_lazy) and the RuntimeState equation structure (totveq, neq, iseq, Stiff_length) which do not exist before Fem.f90:1909."

[[checkpoint]]
id = "increment_ready(1,1)"
order = 3
covered = true
site = "Fem.f90:3657"
anchor = "83ef072c130e"
anchor_stmt = "ttime0=ttime"
after = ["Fem.f90:3625", "Fem.f90:3631", "Fem.f90:3652"]
first_consumer = "dfact_time_curve"
snapshot_files = ["steps.json", "control.json", "constraints.sha256", "loads.sha256"]
note = "Inside the iincs=1 iteration of STATIC_U after the two .man increment records (:3625 increment_control, :3631 tolerances) and the print at :3652; :3633-3650 are dead (cwater=0, Qstatic=0). First consumers: :3654-3667 (ttime, dfact_time_curve, modf_var_prescribed -> fixed), :3672 gravity -> element%field(1)%rload, :3678 force_external -> tofor, :3711 algort, :3733 stiff_u, :3749 estif_assemble/global_stif_profile. fixed and tcurves%dfact are still zero here (R24)."

[[checkpoint]]
id = "restart_ready"
order = 4
covered = false
reason = "restart=0 on both golden cases; resta_read_write(1) (Fem.f90:283) and the .rtt/.stf units are not on the static_2d path. Registered with zero fields so the vocabulary is complete."

