note = "group(igroup)%list(1:nelgroup): ragged, one ordered list per group in record order (Global.f90:1292). Serializer writes one list per elset. Adapter emits one group(igroup)%list(1:nelgroup) list per elset, one line per group key, so the record is keyed by the elset (section name), not by element id; the VALUES are element ids. Owner collection is ProblemState.mesh.elsets[] (not the former shared mesh.sets[]): elsets are keyed by the section/group name and are ragged [nelgroup,ngroup], node sets are keyed by the boundary name and are flat [ndofix], so the two never shared a shape or a key. YL has no separate elset name; the group name is both the section name and the elset name on this path, which is why index_by is sections[].name."

