case = "static_2d.cooks_membrane"
field = "materials.E"
index = "[1]"
legacy_edit = ".mat ELASTIC_ISOTROPIC record, E 2.5e10 -> 2.6e10 (Material.f90:310 item 5)"
expected_only = true

[[perturbation]]
id = "P-BC"
case = "static_2d.cooks_membrane"
field = "steps0.boundary.value"
index = "[set=1]"
legacy_edit = ".pre set 1 value record, val_fix(1) 0.0 -> 1.0e-3 (Prescrib.f90:242; 17*0. record of set 1)"
expected_only = true
note = "index is set-name based (steps[0].boundary[].name, consistent with index_by): the first node of set 1. prescrib records are ordered set x node (Prescrib.f90:216,253), but on lame_cylinder the record order differs from the set order in the deck, so a positional [1] would not name the same record on both cases."

[[perturbation]]
id = "P-G"
case = "static_2d.cooks_membrane"
field = "steps0.load.gravity.magnitude"
index = "[]"
legacy_edit = ".loa body-force record, gravy 9.81 -> 9.80 (Load.f90:912 item 1)"
expected_only = true
