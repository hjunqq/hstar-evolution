note = "Value as read from the .glb group header into group%matno; that slot is OVERWRITTEN in place at Fem.f90:1717 (see sections.material) and is not observable at model_ready. Serialised via `reconstruct` from element%matno. Both values are identical on the golden decks. Dependency direction: reader -> mesh.elements.material -> this row -> sections.material (acyclic). Owner is ProblemState.sections[].material_header, the value AS READ from the .glb group header; the effective value after matno_process (Fem.f90:1717) is ProblemState.sections[].material (row sections.material). The two were one owner path and could not both map to a single type field. legacy_only: the header slot exists only so the bridge can re-emit the .glb group header; the authoring contract names one material per section and lets the step override it. Adapter emits element(group(g)%list(1))%matno after allocation, association, non-empty-list and index checks."

