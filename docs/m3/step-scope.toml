[[path]]
path = "steps[].activation"
scope = "per_block"
legacy_symbol = "appear"
reason = "legacy does not re-READ this -- appear_process is read once -- but it re-DERIVES `appear` from it at the top of every block (Fem.f90:1716) and prescrib_set then rebuilds iffix from that appear. Deriving the freeze mask from steps(1) is what left the staged group frozen for the whole run on loads_2d.wall_reservoir (2026-09-16); the mask is now re-derived per block by legacy's own extracted loop"
recommitted_by = "commit_block_state"
via = "prescribe_free_active"

