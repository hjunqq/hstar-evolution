# HSTAR Evolution — step-scope registry (M7, 2026-09-16)
#
# One row per ProblemState path that a PUBLISHING module reads through `steps(1)`.
# `tools/yl_step_scope_check.py` requires a row for every such read, a read for
# every row, and cross-checks each row's `scope` against what legacy actually does
# per block -- see that file's header for why this class of mistake needs a gate of
# its own rather than a convention.
#
# scope:
#   per_analysis       legacy assigns the symbol once, outside the block loop
#   per_block          legacy re-derives it every block, and `recommitted_by` names
#                      the routine that does the same here (`via` when it delegates
#                      to legacy's own extracted loop)
#   per_block_refused  legacy re-derives it every block and this build cannot, so
#                      `refused_by` names the routine that refuses such a deck

version = 1

[[path]]
path = "steps[].output.field.u"
scope = "per_analysis"
legacy_symbol = "gid_u"
reason = "GiD output switch; read once by global_data from .glb, before the block loop. The switches are a property of the run, not of a step: legacy has one set of them and no way to vary them per block"
refused_by = "commit_step_invariants"

