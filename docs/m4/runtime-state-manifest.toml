  order_time = group(igroup)%order_time(ikh,ifield)
Surfaced as `forrtl: severe (408): Attempt to use pointer ORDER_TIME when it is not
associated with a target` on the adapter-driven solve, 2026-09-10, immediately after
element_field_khandmc_fstif was fixed.
"""
why_not_on_compare_face = """
It HAS a map row -- sections.order_time -- but that row is `emit = "none"` and
`compare = "ignore"` ("time-derivative order per field; static path uses order 0"),
so it is registered and never emitted, never compared, and commit nullifies the
pointer with the rest of group's. The existence face is disjoint from the map's
EMITTED rows, not from the map; a non-emitted row is exactly the shape that can need
to exist without being compared, and `map_row` records the link so the two tables
can be read against each other.
"""

