A-GLB/tension-joint-nonzero. The zeros are NOT a pinned constant of the kind
stab_matde warns against -- the capability gate refuses any deck with tsel/=0
(the parser reads none of the element ids that would follow), so on every deck
this build accepts, the array IS all zeros. That gate did not exist until
2026-09-10; it was added in the same change as this row, and this row would not
be admissible without it.
"""

