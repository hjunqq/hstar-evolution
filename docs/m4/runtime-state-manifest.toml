observed_requirement = """
Fem.f90:13417, FORCE_EXTERNAL:
  nrfields = element(ielem)%nrfields
  do ifield = 1, nrfields ...
With nrfields = 0 the body-force loop never runs, so tload never accumulates rload
and tofor stays zero. Observed 2026-09-10 by gdb at Fem.f90:3685 with the adapter on:
element(1)%nrfields = 0 against 1 in legacy mode, while element(1)%field(1)%rload(2)
was IDENTICAL (-47915.718738445263) in both -- gravity had already computed the right
element load and the assembly threw it away.
"""
why_not_on_compare_face = """
commit's poison_element says it outright: "The type's other scalars (nstre, nrfields,
ne_include, jblks, ktotg, icbound, neqcy, area, minedge, elength) are not assigned
here and so are not poisoned; none of their map rows is emitted at model_ready." The
comparison face never looked at it, and the three state dumps agreed on all 190
emitted fields across all three checkpoints while the results were nonetheless zero.
That is this face's sharpest example: state equivalence at every registered checkpoint
did NOT imply numeric equivalence, because the assembly reads a scalar nobody registered.
"""

