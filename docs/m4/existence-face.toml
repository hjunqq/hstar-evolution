# The EXISTENCE FACE (ADR-0009).
#
# WHAT THIS TABLE IS
#   Legacy globals the solver requires to EXIST but whose values do not belong on the
#   comparison face. `docs/m2/state-field-map.toml` answers "what do we compare";
#   this file answers "what must exist". Those two questions were safely confused
#   until the adapter path first drove a solve, at which point the difference showed
#   up as an unallocated-array abort rather than as a wrong number.
#
# THE ADMISSION RULE, AND IT IS STRICT
#   A row is added ONLY after execution demanded it -- a real abort, in a real run,
#   at a named site. Never because a scan suggested it might be needed. The whole
#   defect this face exists to fix was a classification made by reading
#   (`order_time_mdofn` was tagged "unused_switch / dynamic time integration") being
#   overturned by execution, and populating this table by reading would reproduce it.
#   `observed_requirement` is the evidence line, and it is mandatory.
#
# WHY NOT JUST PUT THESE IN THE MAP
#   Because the residue set is computed from EMITTED rows (tools/yl_state_map.py),
#   so a row can only join it by joining the snapshot -- which makes the frozen
#   baseline incomplete and forces a re-freeze. `yl_state_probe.py freeze` is
#   deliberately one-shot with no --force, and ADR-0006 says why: the baseline is
#   worth something because it does not follow the implementation.
#
# WHY NOT LET THE ADAPTER ALLOCATE THEM DIRECTLY
#   That is a second writer of legacy globals, which M4-01's hard constraint forbids:
#   the snapshot reads globals at a checkpoint and cannot know a second writer has
#   not finished.
#
# GATES (tools/yl_existence_check.py, both directions, set equality -- never
# sufficient conditions; see docs/m4/L2c-fold-design.md on why)
#   E1  this table's rows  ==  deck_existence_t's components (and names match)
#   E2  this table's rows  ==  the symbols commit's existence pass writes
#   E3  this table's symbols are DISJOINT from the map's emitted rows -- a value that
#       is compared must not also be claimed as "not observed"

version = 1

[[array]]
symbol = "order_time_mdofn"
carrier = "order_time_mdofn"
module = "global_var"
extent = "mdofn"
dtype = "i32"
value_source = "deck"
deck_reader = "GLB.global_data.order_time_mdofn"
legacy_allocation = "Global.f90:954"
observed_requirement = """
Fem.f90:10752, predict (called from static_u every increment):
  ordert = order_time_mdofn(lcdofn(idofn))
read once per degree of freedom. Surfaced as
`forrtl: severe (408): Attempt to fetch from allocatable variable ORDER_TIME_MDOFN
when it is not allocated` on the first adapter-driven solve, 2026-09-10.
"""
why_not_on_compare_face = """
M1 classified this reader `state_target = "unused_switch"`, `consumers = "dynamic
time integration"`, and M2 gave it no map row at all. That classification is right
about EFFECT and wrong about ACCESS: on the static path every value is 0, the
consumer branch is inert, and predict still reads the array once per dof. So its
value genuinely does not need to be compared -- and it genuinely does need to be
allocated and carry the deck's values, because a second deck may not be all zeros.
"""
