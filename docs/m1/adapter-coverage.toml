# carried through ProblemState.surface_edges and steps[].load.pressure -- but NOT by the
# M4 legacy-deck adapter, which refuses a multi-block deck at parse time and therefore
# never reaches them. Writing a legacy-deck parser for them would be a parser with no
# deck to read: every deck that has these records also has more than one block.
