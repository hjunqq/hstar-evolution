# HSTAR Evolution — adapter coverage registry (R29)
#
# WHAT THIS FILE IS FOR
#   `docs/m1/reader-inventory.toml` says which legacy reads happen on the static path.
#   `src/adapter/**` reproduces them, each read carrying an `RD: <inventory id>` marker.
#   Until 2026-09-13 nothing checked the two against each other, so every statement of the
#   form "the adapter covers all the reads" was neither provable nor refutable — R29.
#   `tools/yl_coverage_check.py` now checks it, and this file is the ONLY way an on-path
#   reader is allowed to have no adapter parser: by being written down, with a reason.
#
# WHY A REGISTRY RATHER THAN A NUMBER
#   R29 was opened because two independent counts of "uncovered readers" disagreed (28 vs
#   36), and at least one entry in the gap was covered all along — the marker just spelled
#   the id differently (`curve_points` for `LOA.external_load_1.curve_factors`). A count
#   cannot be reviewed. A named list can, and the gate prints it in full on every run.
#
# WHAT A ROW MAY NOT HIDE
#   `state_target` is copied from the inventory and the gate REJECTS a row whose copy has
#   drifted, so a row cannot quietly follow the census somewhere else. A row whose target
#   is not `title_skip` or `empty_section` — i.e. one that carries a real value — must
#   additionally carry `evidence`, measured, not argued.
#
# HOW A ROW GETS DELETED
#   By writing the parser. Add the `RD: <id>` marker at the read that reproduces it and
#   remove the row here; the gate fails if an id is both marked and registered.

